[package]
name = "iter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "iter"
path = "src/main.rs"

[dependencies]
clap          = { version = "4.5", features = ["derive", "env"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
crossterm     = "0.28"
unicode-width = "0.1"
