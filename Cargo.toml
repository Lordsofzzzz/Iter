[package]
name = "iter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "iter"
path = "src/main.rs"

[dependencies]
clap          = { version = "4.6", features = ["derive", "env"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
crossterm     = "0.29"
unicode-width = "0.2"
termimad      = "0.34"
syntect       = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
